site_name: WizBot
site_url: https://docs.wizbot.cc/
site_description: WizBot Documentation — guides, commands, and self-hosting references.
site_author: WizNet
repo_url: https://github.com/Wizkiller96/WizBot
repo_name: Wizkiller96/WizBot

theme:
  name: material
  custom_dir: theme
  logo: assets/images/wizbot-logo.png
  favicon: assets/images/wizbot-logo.png

  palette:
    # Auto / System preference
    - media: "(prefers-color-scheme: no-preference)"
      scheme: wizbot-light
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: wizbot-light
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: wizbot-dark
      toggle:
        icon: material/weather-night
        name: Switch to system preference

  font:
    text: Inter
    code: JetBrains Mono

  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Wizkiller96/WizBot
      name: WizBot on GitHub