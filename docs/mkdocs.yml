site_name: WizBot
site_url: https://docs.wizbot.cc/
site_description: WizBot Documentation — guides, commands, and self-hosting references.
site_author: WizNet
repo_url: https://github.com/Wizkiller96/WizBot
repo_name: Wizkiller96/WizBot
docs_dir: md

theme:
  name: material
  custom_dir: theme
  logo: assets/wizbot-logo.png
  favicon: assets/wizbot-logo.png

  palette:
    - media: "(prefers-color-scheme: no-preference)"
      scheme: wizbot-dark
      toggle:
        icon: material/brightness-auto
        name: Switch to dark mode
    - media: "(prefers-color-scheme: light)"
      scheme: wizbot-light
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: wizbot-dark
      toggle:
        icon: material/weather-night
        name: Switch to system preference

  font:
    text: Inter
    code: JetBrains Mono

  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Wizkiller96/WizBot
      name: WizBot on GitHub

# ── Extensions (fixes the :material-icon: raw text issue) ──
markdown_extensions:
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.snippets:
      base_path: md/snippets
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true